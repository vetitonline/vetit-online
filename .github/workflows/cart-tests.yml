name: Browser cart regression tests

on:
  push:
    branches:
      - codex/marketplace-accounts-2026-11-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser cart and checkout selections
        run: node --test tests/journey-browser-cart.test.mjs tests/checkout-cart.test.mjs
      - name: Test offline device and release readiness without credentials
        run: node --test tests/device-testing-readiness.test.mjs tests/fingerprint-input-policy.test.mjs tests/mobile-icon-signing.test.mjs tests/provider-fingerprint-readiness.test.mjs tests/mobile-release-readiness.test.mjs tests/mobile-release-profiles.test.mjs
      - name: Check reviewed project fingerprint inputs
        run: node scripts/check-fingerprint-inputs.mjs

  phone-launcher:
    name: Phone launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test native entry and phone startup without dependencies or credentials
        run: node --test tests/mobile-entry.test.mjs tests/phone-preview-launcher.test.mjs
      - name: Validate safe Windows bootstrap script
        shell: pwsh
        run: ./tests/windows-phone-bootstrap.tests.ps1
      - name: Validate Windows PowerShell 5.1 compatibility
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-phone-bootstrap.tests.ps1
